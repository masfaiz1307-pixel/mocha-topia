server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Proper MIME types for all file extensions used in the project
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets (images, CSS, JS) for better performance
    location ~* \.(jpeg|jpg|png|gif|ico|css|js)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Security: deny access to hidden files (e.g., .git, .env)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Gzip compression for text-based files
    gzip on;
    gzip_types text/plain text/css application/javascript;
    gzip_min_length 256;
}

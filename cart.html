<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Cart – Mocha Topia</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            font-family: Poppins, sans-serif;
            background: #F2D1B6;
            color: #7F5C46;
            padding: 20px;
        }

        h2 {
            text-align: center;
            font-weight: 700;
            margin-bottom: 25px;
            font-size: 32px;
        }

        .cart-container {
            max-width: 700px;
            margin: auto;
        }

        .cart-item {
            display: flex;
            align-items: center;
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .cart-img {
            width: 90px;
            height: 90px;
            border-radius: 10px;
            object-fit: cover;
            margin-right: 15px;
        }

        .cart-details {
            flex: 1;
        }

        .item-name {
            font-size: 18px;
            font-weight: 700;
        }

        .item-price {
            font-size: 14px;
            color: #5e3e2e;
            margin-bottom: 8px;
        }

        .qty-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .qty-btn {
            background: #7F5C46;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #B03A2E;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-left: 10px;
            padding: 5px 10px;
            border-radius: 8px;
            transition: 0.2s;
        }

        .remove-btn:hover {
            background: rgba(176, 58, 46, 0.15);
        }

        .total-box {
            background: white;
            padding: 18px;
            border-radius: 12px;
            text-align: right;
            font-size: 20px;
            font-weight: 700;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .checkout-btn,
        .clear-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
        }

        .checkout-btn {
            background: #7F5C46;
            color: white;
        }

        .clear-btn {
            background: #B03A2E;
            color: white;
        }

        .empty-cart {
            text-align: center;
            padding: 40px;
            color: #7F5C46;
        }

        /* CHECKOUT FORM POPUP */
        #checkoutModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .checkout-box {
            background: white;
            width: 90%;
            max-width: 420px;
            border-radius: 12px;
            padding: 20px;
            animation: fadeIn 0.3s ease;
            position: relative;
        }

        .checkout-box h3 {
            margin-top: 0;
            color: #7F5C46;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #7F5C46;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 2px solid #7F5C46;
            outline: none;
            font-size: 14px;
            box-sizing: border-box;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            background: #7F5C46;
            color: white;
            border: none;
            padding: 12px;
            margin-top: 15px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }

        .submit-btn:hover {
            background: #6a4d3a;
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <h2>Your Cart</h2>

    <div class="cart-container" id="cartContainer"></div>
    <div class="total-box" id="totalBox">Total: Rp 0</div>

    <button class="checkout-btn" onclick="openCheckout()">Proceed to Checkout</button>
    <button class="clear-btn" onclick="clearCart()">Clear Cart</button>

    <!-- CHECKOUT POPUP -->
    <div id="checkoutModal">
        <div class="checkout-box">
            <button class="close-modal" onclick="closeCheckout()">&times;</button>
            <h3>Checkout</h3>

            <input id="name" type="text" placeholder="Your Name" required>
            <input id="phone" type="tel" placeholder="Phone Number" required>
            <textarea id="address" placeholder="Delivery Address" required></textarea>

            <select id="payment" required>
                <option value="">Select Payment Method</option>
                <option value="Cash">Cash</option>
                <option value="QRIS">QRIS</option>
                <option value="Bank Transfer">Bank Transfer</option>
            </select>

            <button class="submit-btn" onclick="submitOrder()">Place Order</button>
        </div>
    </div>

    <script>
        function loadCart() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            let container = document.getElementById("cartContainer");
            container.innerHTML = "";
            let total = 0;

            if (cart.length === 0) {
                container.innerHTML = '<div class="empty-cart"><h3>Your cart is empty</h3><p>Add some delicious items!</p></div>';
                document.querySelector('.checkout-btn').disabled = true;
                document.querySelector('.clear-btn').disabled = true;
            } else {
                document.querySelector('.checkout-btn').disabled = false;
                document.querySelector('.clear-btn').disabled = false;

                cart.forEach((item, index) => {
                    total += item.price * item.qty;

                    container.innerHTML += `
                        <div class="cart-item">
                            <img src="${item.img || 'images/default.png'}" class="cart-img" alt="${item.name}">
                            <div class="cart-details">
                                <div class="item-name">${item.name}</div>
                                <div class="item-price">Rp ${item.price.toLocaleString()}</div>

                                <div class="qty-box">
                                    <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
                                    <span>${item.qty}</span>
                                    <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>

                                    <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
                                </div>
                            </div>
                        </div>
                    `;
                });
            }

            document.getElementById("totalBox").innerText =
                "Total: Rp " + total.toLocaleString();
        }

        function changeQty(index, amount) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart[index].qty = Math.max(1, cart[index].qty + amount);
            localStorage.setItem("cart", JSON.stringify(cart));
            loadCart();
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            cart.splice(index, 1);
            localStorage.setItem("cart", JSON.stringify(cart));
            loadCart();
        }

        function clearCart() {
            if (confirm("Clear all items from your cart?")) {
                localStorage.removeItem("cart");
                loadCart();
            }
        }

        function openCheckout() {
            let cart = JSON.parse(localStorage.getItem("cart")) || [];
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }
            document.getElementById("checkoutModal").style.display = "flex";
        }

        function closeCheckout() {
            document.getElementById("checkoutModal").style.display = "none";
            // Clear form fields
            document.getElementById("name").value = "";
            document.getElementById("phone").value = "";
            document.getElementById("address").value = "";
            document.getElementById("payment").value = "";
        }

        function submitOrder() {
            let name = document.getElementById("name").value.trim();
            let phone = document.getElementById("phone").value.trim();
            let address = document.getElementById("address").value.trim();
            let payment = document.getElementById("payment").value;

            if (!name || !phone || !address || !payment) {
                alert("Please fill in all fields");
                return;
            }

            let cart = JSON.parse(localStorage.getItem("cart")) || [];

            if (cart.length === 0) {
                alert("Your cart is empty!");
                closeCheckout();
                return;
            }

            let order = {
                name,
                phone,
                address,
                payment,
                cart: cart,
                time: new Date().toLocaleString()
            };

            // Save order and clear cart
            localStorage.setItem("lastOrder", JSON.stringify(order));
            localStorage.removeItem("cart");

            // Close modal first
            closeCheckout();

            // Show success message
            alert("Thank you! Your order has been placed successfully.");

            // Redirect to home page
            // Check if we're in a frame, if so target parent's main frame
            if (window.parent && window.parent !== window) {
                window.parent.frames['main'].location.href = "home.html";
            } else {
                window.location.href = "home.html";
            }
        }

        // Close modal when clicking outside
        document.getElementById("checkoutModal").addEventListener('click', function (e) {
            if (e.target === this) {
                closeCheckout();
            }
        });

        // Load cart on page load
        loadCart();
    </script>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Mocha-Topia Contact</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    /* Coffee Glow Layer */
    #coffeeGlow {
      position: fixed;
      top: 0;
      left: 0;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(127, 92, 70, 0.25), transparent 70%);
      pointer-events: none;
      z-index: 1;
      filter: blur(40px);
      transition: transform 0.05s linear;
    }

    /* CART ICON */
    .cart-icon {
      position: fixed;
      top: 15px;
      right: 20px;
      font-size: 28px;
      cursor: pointer;
      z-index: 99;
      transition: transform 0.2s;
    }

    .cart-icon:hover {
      transform: scale(1.1);
    }

    .cart-badge {
      background: red;
      color: white;
      padding: 3px 7px;
      border-radius: 50%;
      font-size: 12px;
      position: absolute;
      top: -8px;
      right: -10px;
    }

    .loading {
      display: none;
      text-align: center;
      margin-top: 10px;
      color: #7F5C46;
    }

    .spinner {
      border: 3px solid #f3f3f3;
      border-top: 3px solid #7F5C46;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 10px auto;
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* SUCCESS MESSAGE */
    .success-box {
      display: none;
      background: #d4edda;
      border: 2px solid #c3e6cb;
      color: #155724;
      padding: 20px;
      border-radius: 10px;
      margin: 20px 0;
      text-align: center;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .success-box h3 {
      margin: 0 0 10px 0;
      color: #155724;
    }

    .success-box p {
      margin: 10px 0;
    }

    .success-icon {
      font-size: 50px;
      margin-bottom: 10px;
    }
  </style>
</head>

<body class="page">
  <div id="coffeeGlow"></div>
  <!-- CART ICON -->
  <div class="cart-icon" onclick="goToCart()">
    🛒 <span class="cart-badge" id="cartCount">0</span>
  </div>

  <main class="container">
    <h2>Contact Us</h2>
    <p>Send us a message and we'll get back to you soon!</p>

    <!-- SUCCESS MESSAGE BOX -->
    <div class="success-box" id="successBox">
      <div class="success-icon">✅</div>
      <h3>Message Sent Successfully!</h3>
      <p>Thank you for contacting Mocha Topia!</p>
      <p>We have received your message and will get back to you as soon as possible.</p>
      <p style="font-size: 14px; margin-top: 15px;">You will also receive a confirmation email shortly.</p>
    </div>

    <div id="formContainer">
      <form id="contactForm">
        <label for="name">Full Name *</label>
        <input id="name" name="name" type="text" required>

        <label for="email">Email *</label>
        <input id="email" name="email" type="email" required>

        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="tel">

        <label for="topic">Topic</label>
        <select id="topic" name="topic">
          <option value="">Select</option>
          <option value="Feedback">Feedback</option>
          <option value="Collaboration">Collaboration</option>
          <option value="Question">Question</option>
          <option value="Order Inquiry">Order Inquiry</option>
          <option value="Other">Other</option>
        </select>

        <label>Visit Type *</label>
        <div style="display: flex; gap: 20px; align-items: center;">
          <label>Dine In<input type="radio" name="visit_type" value="Dine In" required></label>
          <label>Takeaway<input type="radio" name="visit_type" value="Takeaway"></label>
        </div>

        <div style="display: flex; gap: 20px; align-items: center; margin-top: 10px;">
          <label>Subscribe to newsletter<input type="checkbox" name="newsletter" id="newsletter" value="Yes"></label>
        </div>

        <label for="message">Message *</label>
        <textarea id="message" name="message" rows="4" required></textarea>

        <button class="btn" type="submit" id="submitBtn">Send Message</button>

        <div class="loading" id="loading">
          <div class="spinner"></div>
          <p>Sending your message...</p>
        </div>

        <div id="formMsg" aria-live="polite" style="margin-top:12px;"></div>
      </form>
    </div>
  </main>

  <script>
    // Smooth coffee glow parallax
    $(document).mousemove(function (e) {
      $("#coffeeGlow").css({
        transform: `translate(${e.pageX / 25}px, ${e.pageY / 25}px)`
      });
    });

    // Function to navigate to cart page (works in frameset or standalone)
    function goToCart() {
      if (window.parent && window.parent !== window) {
        window.parent.frames['main'].location.href = "cart.html";
      } else {
        window.location.href = "cart.html";
      }
    }

    // Update cart badge
    function updateCartBadge() {
      let cart = JSON.parse(localStorage.getItem("cart")) || [];
      let total = cart.reduce((sum, i) => sum + i.qty, 0);
      document.getElementById("cartCount").innerText = total;
    }

    updateCartBadge();
    window.addEventListener('storage', updateCartBadge);
    setInterval(updateCartBadge, 1000);

    // Form submission handling with AJAX
    $('#contactForm').on('submit', function (e) {
      e.preventDefault();

      const name = $('#name').val().trim();
      const email = $('#email').val().trim();
      const phone = $('#phone').val().trim();
      const topic = $('#topic').val();
      const visitType = $('input[name="visit_type"]:checked').val();
      const newsletter = $('#newsletter').is(':checked') ? 'Yes' : 'No';
      const message = $('#message').val().trim();

      // Validate required fields
      if (name.length < 2) {
        $('#formMsg').text('Please enter your full name.').css('color', '#a00');
        return false;
      }

      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        $('#formMsg').text('Please enter a valid email address.').css('color', '#a00');
        return false;
      }

      if (message.length < 10) {
        $('#formMsg').text('Please enter a message (at least 10 characters).').css('color', '#a00');
        return false;
      }

      if (!visitType) {
        $('#formMsg').text('Please select a visit type.').css('color', '#a00');
        return false;
      }

      // Show loading
      $('#submitBtn').prop('disabled', true).text('Sending...');
      $('#loading').show();
      $('#formMsg').text('');

      // Send form using AJAX to prevent redirect
      $.ajax({
        url: 'https://formsubmit.co/masfaiz1307@gmail.com',
        method: 'POST',
        data: {
          name: name,
          email: email,
          phone: phone,
          topic: topic,
          visit_type: visitType,
          newsletter: newsletter,
          message: message,
          _subject: 'New Contact Form Submission - Mocha Topia',
          _captcha: 'false',
          _template: 'table',
          _autoresponse: 'Thank you for contacting Mocha Topia! We have received your message and will get back to you soon.'
        },
        dataType: 'json',
        success: function () {
          // Hide loading
          $('#loading').hide();
          $('#submitBtn').prop('disabled', false).text('Send Message');

          // Redirect to success page
          if (window.parent && window.parent !== window && window.parent.frames['main']) {
            window.parent.frames['main'].location.href = "contact-success.html";
          } else {
            window.location.href = "contact-success.html";
          }
        },
        error: function () {
          // Even on "error", FormSubmit might have sent the email
          // FormSubmit returns CORS errors but still sends the email
          $('#loading').hide();
          $('#submitBtn').prop('disabled', false).text('Send Message');

          // Redirect to success page
          if (window.parent && window.parent !== window && window.parent.frames['main']) {
            window.parent.frames['main'].location.href = "contact-success.html";
          } else {
            window.location.href = "contact-success.html";
          }
        }
      });
    });
  </script>
</body>

</html>

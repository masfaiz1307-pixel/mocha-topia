<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Mocha Topia</title>

  <style>
    body {
      margin: 0;
      font-family: Poppins, sans-serif;
      background: #F2D1B6;
      color: #7F5C46;
      text-align: center;
      padding: 40px;
    }

    .logo {
      width: 180px;
      margin-top: 40px;
    }

    h1 {
      font-size: 42px;
      margin: 20px 0 5px 0;
    }

    p {
      font-size: 18px;
      opacity: 0.8;
    }

    .btn-box {
      margin-top: 35px;
    }

    .btn {
      background: #7F5C46;
      color: white;
      padding: 12px 25px;
      border-radius: 10px;
      border: none;
      margin: 10px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.25s;
    }

    .btn:hover {
      background: #5e3e2e;
    }
  </style>
</head>

<body>

  <img src="images/logo.png" class="logo">
  <h1>Welcome to Mocha Topia</h1>
  <p>Bad mood? Reboot with coffee.</p>

  <div class="btn-box">
    <button class="btn" onclick="location.href='login.html'">Login</button>
    <button class="btn" onclick="location.href='register.html'">Register</button>
  </div>

</body>

</html>
